services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: labelfeed-db
    environment:
      POSTGRES_USER: labelfeed
      POSTGRES_PASSWORD: labelfeed
      POSTGRES_DB: labelfeed
    # small on purpose, the index is tens of thousands of rows
    command: >
      postgres -c shared_buffers=128MB -c work_mem=16MB -c maintenance_work_mem=128MB
               -c max_connections=20 -c effective_cache_size=256MB -c max_wal_size=256MB -c min_wal_size=64MB
               -c max_parallel_workers_per_gather=0
    ports: ["55117:5432"]
    mem_limit: 640m
    shm_size: 128m
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelfeed"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
