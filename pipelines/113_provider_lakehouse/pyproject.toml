[project]
name = "provider-lake"
version = "0.1.0"
requires-python = ">=3.11"
# pyspark and delta come from the runtime on Databricks, requirements.txt installs them locally

[project.scripts]
provider-lake = "provider_lake.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provider_lake = ["contracts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
