# Kafka Connect worker for the host JVM run (make connect-up). Same settings as the docker-connect profile.
bootstrap.servers=localhost:19116
group.id=hpd116-connect
listeners=http://localhost:18116
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false
config.storage.topic=_connect_configs
offset.storage.topic=_connect_offsets
status.storage.topic=_connect_status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=5000
producer.compression.type=zstd
plugin.path=PLUGIN_PATH
