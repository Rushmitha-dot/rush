name: 117 drug label feed

on:
  push:
    paths: ["pipelines/117_drug_label_rag_feed/**", ".github/workflows/pipeline-117-drug-label-feed.yml"]
  pull_request:
    paths: ["pipelines/117_drug_label_rag_feed/**"]

defaults:
  run:
    working-directory: pipelines/117_drug_label_rag_feed

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env: {POSTGRES_USER: labelfeed, POSTGRES_PASSWORD: labelfeed, POSTGRES_DB: labelfeed}
        ports: ["55117:5432"]
        options: --health-cmd "pg_isready -U labelfeed" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pipelines/117_drug_label_rag_feed/requirements*.txt}
      # CPU torch wheel, the default one pulls CUDA libraries the tests never use
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements-dev.txt
      - run: ruff check src tests
      # tests use a hashing embedder, so no model download here
      - run: python -m pytest -q
        env: {PYTHONPATH: src}
