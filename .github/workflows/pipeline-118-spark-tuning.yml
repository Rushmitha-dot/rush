name: 118 medicare spark tuning

on:
  push:
    paths: ["pipelines/118_medicare_spark_tuning/**", ".github/workflows/pipeline-118-spark-tuning.yml"]
  pull_request:
    paths: ["pipelines/118_medicare_spark_tuning/**"]

defaults:
  run:
    working-directory: pipelines/118_medicare_spark_tuning

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Spark 3.5 supports Java 17. On 21 its Arrow build can't run pandas UDFs (see docs/design.md)
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pipelines/118_medicare_spark_tuning/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      # includes every experiment, one run each, on the fixture lake
      - run: python -m pytest -q
        env: {PYTHONPATH: src, SPARK_MASTER: "local[2]"}
