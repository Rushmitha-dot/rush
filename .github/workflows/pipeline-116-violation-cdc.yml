name: 116 violation cdc

on:
  push:
    paths: ["pipelines/116_housing_violation_cdc/**", ".github/workflows/pipeline-116-violation-cdc.yml"]
  pull_request:
    paths: ["pipelines/116_housing_violation_cdc/**"]

defaults:
  run:
    working-directory: pipelines/116_housing_violation_cdc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pipelines/116_housing_violation_cdc/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      # merge, history, gold and parity run against a temp Iceberg catalog; the stack tests skip without Docker
      - run: python -m pytest -q -m "not stack"
        env: {PYTHONPATH: src}
